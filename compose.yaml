name: kvarta

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kvarta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kvarta}
      POSTGRES_DB: ${POSTGRES_DB:-kvarta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kvarta} -d ${POSTGRES_DB:-kvarta}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  migrate:
    image: kvarta-back:dev
    build:
      context: ./backend
      target: dev
    command: ["alembic", "upgrade", "head"]
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: kvarta-back:dev
    build:
      context: ./backend
      target: dev
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    image: kvarta-front:dev
    build:
      context: ./backend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
      API_INTERNAL_BASE_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_react_router:/app/.react-router
    depends_on:
      - backend
    restart: "no"

volumes:
  pgdata:
  frontend_node_modules:
  frontend_react_router:
