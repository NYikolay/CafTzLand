name: kvarta

services:
  db:
    image: postgres:18-alpine
    env_file: ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  migrate:
    image: kvarta-back:dev
    build:
      context: ./backend
      target: dev
    command: ["alembic", "upgrade", "head"]
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: kvarta-back:dev
    build:
      context: ./backend
      target: dev
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # BFF/nginx обращаются к backend по DNS-имени: Host: backend:8000
      ALLOWED_HOSTS: '["localhost","127.0.0.1","backend"]'
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    image: kvarta-front:dev
    build:
      context: ./frontend
      target: dev
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: "no"

volumes:
  pgdata:
  frontend_node_modules:
