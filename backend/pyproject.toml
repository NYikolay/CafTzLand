[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikolay",email = "nukolaeakovets007@mail.ru"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.143.2,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "uvicorn-worker (>=0.3.0)",
    "sqlalchemy[asyncio] (==2.1.4)",
    "alembic (==1.20.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic (>=2.13.0,<2.14.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "sqladmin[auth] (>=0.32.0,<0.33.0)",
    "aiogram (>=3.31.0,<4.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "mypy (>=1.18.0,<2.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
]

[tool.poetry]
packages = [{ include = "app", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "PT", "RUF"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["sqladmin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
